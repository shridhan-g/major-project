<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favico.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="google-site-verification"
            content="SWz8X8DCVop67wcMRFhVd2-G0SSz74upYEAxVFwLogM"
        />
        <title>Genie - Home Services Platform</title>
        <link
            rel="preload"
            href="src/fonts/NeueMachina-Regular.otf"
            as="font"
            type="font/otf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            href="src/fonts/NeueMachina-Ultrabold.otf"
            as="font"
            type="font/otf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            href="src/fonts/TBJNorguba-Regular.woff"
            as="font"
            type="font/woff"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            href="src/fonts/WantedSans-Regular.otf"
            as="font"
            type="font/otf"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            href="src/assets/hero/bg.svg"
            as="image"
            type="image/svg+xml"
        />
        <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
        <style>
            @font-face {
                font-family: "WantedSansRegular";
                src: url("/src/fonts/WantedSans-Regular.otf") format("opentype");
                font-display: swap;
            }

            /* Loader styles */
            .loader {
                background-color: #ffffee;
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            .loading-bar {
                width: 250px;
                height: 5px;
                background: lightgray;
                border-radius: 5px;
                overflow: hidden;
                position: relative;
            }

            .loading-fill {
                height: 100%;
                width: 0;
                background: linear-gradient(to right, #32bdef, #1ea2e4);
                animation: loading 0 linear forwards;
            }

            @keyframes loading {
                0% {
                    width: 0;
                }
                100% {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="loader" id="loader">
            <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
                <text
                    x="50%"
                    y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    font-family="WantedSansRegular, system-ui, -apple-system, sans-serif"
                    letter-spacing="-1.5px"
                    font-size="40"
                    fill="black"
                    font-weight="700"
                >
                    genie
                </text>
            </svg>
            <div class="loading-bar">
                <div class="loading-fill" id="loading-fill"></div>
            </div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
        <script>
            // Handle loader visibility smoothly
            function hideLoader() {
                const loader = document.getElementById("loader");
                if (!loader || loader.style.display === "none") return;
                loader.style.opacity = "0";
                loader.style.transition = "opacity 0.3s ease";
                setTimeout(() => {
                    loader.style.display = "none";
                    document.body.style.overflow = "";
                    document.documentElement.style.overflow = "";
                }, 300);
            }

            window.addEventListener("load", () => {
                setTimeout(hideLoader, 800);
            });

            // Fallback: hide loader after at most 1.5s regardless
            setTimeout(hideLoader, 1500);

            // Hide scrollbar on loading screen
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";
        </script>
    </body>
</html>
